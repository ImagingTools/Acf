name: TeamCity CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  statuses: write
  checks: write
  pull-requests: write
  issues: write

jobs:
  teamcity:
    uses: ./.github/workflows/teamcity-ci.yml
    with:
      build-type-prefix: Acf
      acf-ref: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit
