name: TeamCity CI (reusable)

# Reusable TeamCity trigger. A repository calls it from a short workflow, see Docs/TeamCityCi.md.
on:
  workflow_call:
    inputs:
      platforms:
        description: JSON array of the platforms to build, windows and linux.
        type: string
        default: '["windows","linux"]'
      build-type-prefix:
        description: Builds the id of the TeamCity build configuration as <prefix>_Build_<Platform>_<PR|Main> when the repository variable TEAMCITY_BUILD_TYPE_<PLATFORM>_<PR|MAIN> is not set.
        type: string
        default: ''
      acf-ref:
        description: Ref of ImagingTools/Acf the helper scripts are taken from. Use the same ref as in the uses line.
        type: string
        default: v1
    secrets:
      TEAMCITY_TOKEN:
        description: TeamCity access token with the right to queue and cancel builds.
        required: false

permissions:
  contents: read
  statuses: write
  checks: write
  pull-requests: write
  issues: write

jobs:
  trigger-teamcity:
    name: Trigger TeamCity Build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    # A newer push to the same pull request cancels the older run. Pushes to main keep one group per commit.
    concurrency:
      group: teamcity-${{ github.repository }}-${{ github.event.pull_request.number || github.sha }}-${{ matrix.platform }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}

    steps:
      - name: Checkout the TeamCity CI scripts
        uses: actions/checkout@v6
        with:
          repository: ImagingTools/Acf
          ref: ${{ inputs.acf-ref }}
          path: .teamcity-ci
          sparse-checkout: .github/scripts

      - name: Resolve the TeamCity build configuration
        env:
          EVENT_NAME: ${{ github.event_name }}
          PLATFORM: ${{ matrix.platform }}
          PREFIX: ${{ inputs.build-type-prefix }}
          BT_WINDOWS_PR: ${{ vars.TEAMCITY_BUILD_TYPE_WINDOWS_PR }}
          BT_WINDOWS_MAIN: ${{ vars.TEAMCITY_BUILD_TYPE_WINDOWS_MAIN }}
          BT_LINUX_PR: ${{ vars.TEAMCITY_BUILD_TYPE_LINUX_PR }}
          BT_LINUX_MAIN: ${{ vars.TEAMCITY_BUILD_TYPE_LINUX_MAIN }}
        shell: bash
        run: |
          set -euo pipefail

          source "$GITHUB_WORKSPACE/.teamcity-ci/.github/scripts/teamcity-build-type.sh"

          KIND=main
          if [ "$EVENT_NAME" = "pull_request" ]; then
            KIND=pr
          fi

          EXPLICIT_VAR="BT_${PLATFORM^^}_${KIND^^}"
          echo "TEAMCITY_BUILD_TYPE=$(teamcity_build_type "$PLATFORM" "$KIND" "${!EXPLICIT_VAR}" "$PREFIX")" >> "$GITHUB_ENV"

      - name: Determine branch
        id: branch
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BRANCH_NAME="$PR_HEAD_REF"
            TEAMCITY_BRANCH="$BRANCH_NAME"
            COMMIT_SHA="$PR_HEAD_SHA"
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
            TEAMCITY_BRANCH="$BRANCH_NAME"
            COMMIT_SHA="${GITHUB_SHA}"
          fi

          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"
          echo "TEAMCITY_BRANCH=$TEAMCITY_BRANCH" >> "$GITHUB_ENV"
          echo "COMMIT_SHA=$COMMIT_SHA" >> "$GITHUB_ENV"

          echo "Branch: $BRANCH_NAME"
          echo "TeamCity branchName: $TEAMCITY_BRANCH"
          echo "Commit: $COMMIT_SHA"

      - name: Set pending commit status
        uses: actions/github-script@v8
        env:
          COMMIT_SHA: ${{ env.COMMIT_SHA }}
          PLATFORM: ${{ matrix.platform }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.COMMIT_SHA,
              state: 'pending',
              context: `TeamCity CI (${process.env.PLATFORM})`,
              description: 'TeamCity build queued...'
            });

      - name: Cancel superseded TeamCity builds
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          TEAMCITY_URL: ${{ vars.TEAMCITY_URL }}
          TEAMCITY_TOKEN: ${{ secrets.TEAMCITY_TOKEN }}
          TEAMCITY_BUILD_TYPE: ${{ env.TEAMCITY_BUILD_TYPE }}
          TEAMCITY_BRANCH: ${{ env.TEAMCITY_BRANCH }}
          COMMIT_SHA: ${{ env.COMMIT_SHA }}
        shell: bash
        run: |
          set -euo pipefail

          source "$GITHUB_WORKSPACE/.teamcity-ci/.github/scripts/teamcity-cancel.sh"

          teamcity_cancel_branch_builds "$TEAMCITY_BUILD_TYPE" "$TEAMCITY_BRANCH" "Superseded by $COMMIT_SHA"

      - name: Trigger TeamCity Build (JSON)
        id: teamcity
        env:
          TEAMCITY_URL: ${{ vars.TEAMCITY_URL }}
          TEAMCITY_TOKEN: ${{ secrets.TEAMCITY_TOKEN }}
          TEAMCITY_BUILD_TYPE: ${{ env.TEAMCITY_BUILD_TYPE }}
          TEAMCITY_BRANCH: ${{ env.TEAMCITY_BRANCH }}
          COMMIT_SHA: ${{ env.COMMIT_SHA }}
        shell: bash
        run: |
          set -euo pipefail

          # Validate required configuration
          if [ -z "${TEAMCITY_URL:-}" ] || [ -z "${TEAMCITY_TOKEN:-}" ] || [ -z "${TEAMCITY_BUILD_TYPE:-}" ]; then
            echo "❌ Error: TeamCity configuration not found in repository variables"
            echo "Please configure the following repository variables:"
            echo "  - TEAMCITY_URL: Your TeamCity server URL (e.g., https://teamcity.example.com)"
            echo "  - TEAMCITY_TOKEN: TeamCity access token with build trigger permissions"
            echo "  - TEAMCITY_BUILD_TYPE_WINDOWS_PR: TeamCity build configuration ID for Windows PRs (e.g., MyProject_Build_Windows_PR)"
            echo "  - TEAMCITY_BUILD_TYPE_WINDOWS_MAIN: TeamCity build configuration ID for Windows main branch pushes (e.g., MyProject_Build_Windows_Main)"
            echo "  - TEAMCITY_BUILD_TYPE_LINUX_PR: TeamCity build configuration ID for Linux PRs (e.g., MyProject_Build_Linux_PR)"
            echo "  - TEAMCITY_BUILD_TYPE_LINUX_MAIN: TeamCity build configuration ID for Linux main branch pushes (e.g., MyProject_Build_Linux_Main)"
            exit 1
          fi

          echo "Triggering TeamCity ${{ matrix.platform }} build: $TEAMCITY_BUILD_TYPE"
          echo "TeamCity branchName: $TEAMCITY_BRANCH"
          echo "Commit: $COMMIT_SHA"

          # Use jq to construct JSON payload safely
          JSON_PAYLOAD=$(jq -n \
            --arg bt "$TEAMCITY_BUILD_TYPE" \
            --arg br "$TEAMCITY_BRANCH" \
            --arg sha "$COMMIT_SHA" \
            '{
              buildType: { id: $bt },
              branchName: $br,
              properties: {
                property: [
                  { name: "env.GIT_BRANCH", value: $br },
                  { name: "env.GIT_COMMIT", value: $sha }
                ]
              }
            }')

          BODY=$(curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $TEAMCITY_TOKEN" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data "$JSON_PAYLOAD" \
            "$TEAMCITY_URL/app/rest/buildQueue")

          BUILD_ID=$(echo "$BODY" | jq -r '.id // empty')
          WEB_URL=$(echo "$BODY" | jq -r '.webUrl // empty')

          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "❌ Failed to parse build id from TeamCity response:"
            echo "$BODY"
            exit 1
          fi

          echo "✅ Build queued. ID=$BUILD_ID"
          if [ -n "$WEB_URL" ] && [ "$WEB_URL" != "null" ]; then
            echo "TeamCity URL: $WEB_URL"
          fi

          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "web_url=$WEB_URL" >> "$GITHUB_OUTPUT"

          echo "$BUILD_ID" > teamcity-build-id-${{ matrix.platform }}.txt
          echo "$WEB_URL" > teamcity-build-url-${{ matrix.platform }}.txt

      - name: Upload Build ID Artifact
        if: steps.teamcity.outputs.build_id
        uses: actions/upload-artifact@v7
        with:
          name: teamcity-build-info-${{ matrix.platform }}
          path: |
            teamcity-build-id-${{ matrix.platform }}.txt
            teamcity-build-url-${{ matrix.platform }}.txt
          retention-days: 1

      - name: Wait for TeamCity Build
        if: steps.teamcity.outputs.build_id
        id: wait_build
        timeout-minutes: 130
        env:
          TEAMCITY_URL: ${{ vars.TEAMCITY_URL }}
          TEAMCITY_TOKEN: ${{ secrets.TEAMCITY_TOKEN }}
          BUILD_ID: ${{ steps.teamcity.outputs.build_id }}
          TRIGGERED_WEB_URL: ${{ steps.teamcity.outputs.web_url }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Waiting for TeamCity build $BUILD_ID..."
          if [ -n "${TRIGGERED_WEB_URL:-}" ] && [ "${TRIGGERED_WEB_URL:-}" != "null" ]; then
            echo "TeamCity build URL: $TRIGGERED_WEB_URL"
          fi

          MAX_QUEUED_SECONDS=3600
          MAX_RUNNING_SECONDS=3600
          SLEEP_SECONDS=15

          QUEUED_ELAPSED=0
          RUNNING_ELAPSED=0
          UNEXPECTED_STATE_COUNT=0
          MAX_UNEXPECTED_STATES=3

          source "$GITHUB_WORKSPACE/.teamcity-ci/.github/scripts/teamcity-cancel.sh"

          while true; do
            RESPONSE=$(curl --fail-with-body -sS \
              --retry 5 --retry-delay 2 --retry-all-errors \
              -H "Authorization: Bearer $TEAMCITY_TOKEN" \
              -H "Accept: application/json" \
              "$TEAMCITY_URL/app/rest/builds/id:$BUILD_ID?fields=state,status,webUrl,branchName,canceledInfo")

            STATE=$(echo "$RESPONSE" | jq -r '.state // empty')
            STATUS=$(echo "$RESPONSE" | jq -r '.status // empty')
            WEB_URL=$(echo "$RESPONSE" | jq -r '.webUrl // empty')
            BRANCH=$(echo "$RESPONSE" | jq -r '.branchName // empty')

            echo "State=$STATE Status=$STATUS BranchName=$BRANCH"
            if [ -n "$WEB_URL" ] && [ "$WEB_URL" != "null" ]; then
              echo "TeamCity URL: $WEB_URL"
            fi

            if [ "$STATE" = "queued" ]; then
              if [ "$QUEUED_ELAPSED" -ge "$MAX_QUEUED_SECONDS" ]; then
                echo "❌ Timed out: build stayed queued for ${QUEUED_ELAPSED}s, cancelling it"
                echo "build_status=QUEUE_TIMEOUT" >> "$GITHUB_OUTPUT"
                echo "build_url=$WEB_URL" >> "$GITHUB_OUTPUT"
                teamcity_cancel_build "$BUILD_ID" "Queued too long for the GitHub workflow" || echo "cancel_failed=true" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              sleep "$SLEEP_SECONDS"
              QUEUED_ELAPSED=$((QUEUED_ELAPSED + SLEEP_SECONDS))
            elif [ "$STATE" = "running" ]; then
              if [ "$RUNNING_ELAPSED" -ge "$MAX_RUNNING_SECONDS" ]; then
                echo "❌ Timed out: build stayed running for ${RUNNING_ELAPSED}s, cancelling it"
                echo "build_status=RUN_TIMEOUT" >> "$GITHUB_OUTPUT"
                echo "build_url=$WEB_URL" >> "$GITHUB_OUTPUT"
                teamcity_cancel_build "$BUILD_ID" "Running too long for the GitHub workflow" || echo "cancel_failed=true" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              sleep "$SLEEP_SECONDS"
              RUNNING_ELAPSED=$((RUNNING_ELAPSED + SLEEP_SECONDS))
            elif [ "$STATE" = "finished" ]; then
              if echo "$RESPONSE" | jq -e '.canceledInfo' > /dev/null; then
                echo "❌ The TeamCity build was cancelled"
                echo "build_status=CANCELLED" >> "$GITHUB_OUTPUT"
                echo "build_url=$WEB_URL" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              echo "build_status=$STATUS" >> "$GITHUB_OUTPUT"
              echo "build_url=$WEB_URL" >> "$GITHUB_OUTPUT"
              if [ "$STATUS" = "SUCCESS" ]; then
                echo "✅ Build SUCCESS"
                exit 0
              else
                echo "❌ Build FAILED (status=$STATUS)"
                echo "::error title=TeamCity Build Failed (${{ matrix.platform }})::Build failed with status: $STATUS. Check logs below or at: $WEB_URL"
                exit 1
              fi
            else
              echo "⚠️ Unexpected TeamCity state: '${STATE}'. Full response:"
              echo "$RESPONSE"
              UNEXPECTED_STATE_COUNT=$((UNEXPECTED_STATE_COUNT + 1))
              if [ "$UNEXPECTED_STATE_COUNT" -ge "$MAX_UNEXPECTED_STATES" ]; then
                echo "❌ Encountered unexpected state $UNEXPECTED_STATE_COUNT times. Exiting."
                exit 1
              fi
              sleep "$SLEEP_SECONDS"
            fi
          done

      - name: Cancel TeamCity build of a cancelled run
        id: cancel_own
        if: cancelled() && steps.teamcity.outputs.build_id
        continue-on-error: true
        env:
          TEAMCITY_URL: ${{ vars.TEAMCITY_URL }}
          TEAMCITY_TOKEN: ${{ secrets.TEAMCITY_TOKEN }}
          BUILD_ID: ${{ steps.teamcity.outputs.build_id }}
        shell: bash
        run: |
          set -euo pipefail

          source "$GITHUB_WORKSPACE/.teamcity-ci/.github/scripts/teamcity-cancel.sh"

          teamcity_cancel_build "$BUILD_ID" "The GitHub workflow run was cancelled"

      - name: Fetch Build Logs
        if: always() && steps.teamcity.outputs.build_id
        continue-on-error: true
        env:
          TEAMCITY_URL: ${{ vars.TEAMCITY_URL }}
          TEAMCITY_TOKEN: ${{ secrets.TEAMCITY_TOKEN }}
          BUILD_ID: ${{ steps.teamcity.outputs.build_id }}
        shell: bash
        run: |
          set -euo pipefail

          echo "📋 Fetching build log information for build $BUILD_ID..."

          LOG_URL="$TEAMCITY_URL/downloadBuildLog.html?buildId=$BUILD_ID"
          echo "Build log URL: $LOG_URL"

          echo ""
          echo "📄 Last 100 lines of build log:"
          echo "================================"
          curl -sS \
            -H "Authorization: Bearer $TEAMCITY_TOKEN" \
            -H "Accept: text/plain" \
            "$LOG_URL" | tail -n 100
          echo "================================"
          echo ""

          echo "🔍 Checking for build problems..."
          PROBLEMS=$(curl -sS \
            -H "Authorization: Bearer $TEAMCITY_TOKEN" \
            -H "Accept: application/json" \
            "$TEAMCITY_URL/app/rest/builds/id:$BUILD_ID/problemOccurrences?fields=problemOccurrence(id,type,identity,details)" || echo '{}')

          PROBLEM_COUNT=$(echo "$PROBLEMS" | jq -r '.count // 0')
          if [ "$PROBLEM_COUNT" -gt 0 ]; then
            echo "⚠️ Found $PROBLEM_COUNT build problem(s):"
            echo "$PROBLEMS" | jq -r '.problemOccurrence[]? | "- Type: \(.type // "Unknown"), Details: \(.details // .identity // "No details available")"'
          else
            echo "✓ No build problems found"
          fi

          echo ""
          echo "🧪 Checking for test failures..."
          TESTS=$(curl -sS \
            -H "Authorization: Bearer $TEAMCITY_TOKEN" \
            -H "Accept: application/json" \
            "$TEAMCITY_URL/app/rest/builds/id:$BUILD_ID/testOccurrences?status=FAILURE" || echo '{}')

          TEST_COUNT=$(echo "$TESTS" | jq -r '.count // 0')
          if [ "$TEST_COUNT" -gt 0 ]; then
            echo "❌ Found $TEST_COUNT failed test(s):"
            echo "$TESTS" | jq -r '.testOccurrence[]? | "- \(.name): \(.details // "No details")"'
          else
            echo "✓ No test failures found"
          fi

          echo ""
          echo "📊 Build Summary:"
          echo "- Build ID: $BUILD_ID"
          echo "- Build URL: ${{ steps.wait_build.outputs.build_url || steps.teamcity.outputs.web_url }}"
          echo "- Status: ${{ steps.wait_build.outputs.build_status || 'Unknown' }}"
          echo "- Platform: ${{ matrix.platform }}"
          echo "- Full logs: $TEAMCITY_URL/downloadBuildLog.html?buildId=$BUILD_ID"

      - name: Report Build Status
        if: always() && steps.teamcity.outputs.build_id
        uses: actions/github-script@v8
        env:
          BUILD_STATUS: ${{ steps.wait_build.outputs.build_status || 'Unknown' }}
          BUILD_URL: ${{ steps.wait_build.outputs.build_url || steps.teamcity.outputs.web_url }}
          COMMIT_SHA: ${{ env.COMMIT_SHA }}
          PLATFORM: ${{ matrix.platform }}
          CANCEL_OUTCOME: ${{ steps.cancel_own.outcome }}
          CANCEL_FAILED: ${{ steps.wait_build.outputs.cancel_failed }}
        with:
          script: |
            const status = process.env.BUILD_STATUS;
            const buildUrl = process.env.BUILD_URL;
            const sha = process.env.COMMIT_SHA;
            const platform = process.env.PLATFORM;

            let state, desc;
            if (process.env.CANCEL_OUTCOME === 'success') {
              state = 'error';
              desc = 'Workflow run cancelled (superseded or stopped), the TeamCity build was cancelled';
            } else if (process.env.CANCEL_OUTCOME === 'failure') {
              state = 'error';
              desc = 'Workflow run cancelled, but TeamCity did not accept the cancellation, the build may still run';
            } else if (status === 'SUCCESS') {
              state = 'success';
              desc = 'TeamCity build succeeded';
            } else if (status === 'CANCELLED') {
              state = 'error';
              desc = 'The TeamCity build was cancelled';
            } else if (status === 'QUEUE_TIMEOUT' || status === 'RUN_TIMEOUT') {
              const where = status === 'QUEUE_TIMEOUT' ? 'waited too long in the queue' : 'ran too long';
              state = 'error';
              desc = process.env.CANCEL_FAILED === 'true'
                ? `TeamCity build ${where} and could not be cancelled, it may still run`
                : `TeamCity build ${where} and was cancelled`;
            } else if (status === 'Unknown') {
              state = 'error';
              desc = 'TeamCity build status could not be determined';
            } else {
              state = 'failure';
              desc = `TeamCity build failed (${status})`;
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: sha,
              state: state,
              target_url: buildUrl || undefined,
              context: `TeamCity CI (${platform})`,
              description: desc
            });

            core.notice(`TeamCity Build (${platform}): ${status} — ${buildUrl}`);
            if (state === 'failure') {
              core.warning(`TeamCity Build Failed (${platform}): ${status}. Logs: ${buildUrl}`);
            }

  cancel-closed-pr:
    name: Cancel builds of a closed pull request
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    # The same group as the trigger job, so that closing the pull request also stops its run in progress.
    concurrency:
      group: teamcity-${{ github.repository }}-${{ github.event.pull_request.number }}-${{ matrix.platform }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms) }}
    steps:
      - name: Checkout the TeamCity CI scripts
        uses: actions/checkout@v6
        with:
          repository: ImagingTools/Acf
          ref: ${{ inputs.acf-ref }}
          path: .teamcity-ci
          sparse-checkout: .github/scripts

      - name: Resolve the TeamCity build configuration
        env:
          PLATFORM: ${{ matrix.platform }}
          PREFIX: ${{ inputs.build-type-prefix }}
          BT_WINDOWS_PR: ${{ vars.TEAMCITY_BUILD_TYPE_WINDOWS_PR }}
          BT_WINDOWS_MAIN: ${{ vars.TEAMCITY_BUILD_TYPE_WINDOWS_MAIN }}
          BT_LINUX_PR: ${{ vars.TEAMCITY_BUILD_TYPE_LINUX_PR }}
          BT_LINUX_MAIN: ${{ vars.TEAMCITY_BUILD_TYPE_LINUX_MAIN }}
        shell: bash
        run: |
          set -euo pipefail

          source "$GITHUB_WORKSPACE/.teamcity-ci/.github/scripts/teamcity-build-type.sh"

          KIND=pr

          EXPLICIT_VAR="BT_${PLATFORM^^}_${KIND^^}"
          echo "TEAMCITY_BUILD_TYPE=$(teamcity_build_type "$PLATFORM" "$KIND" "${!EXPLICIT_VAR}" "$PREFIX")" >> "$GITHUB_ENV"

      - name: Cancel the builds of the branch
        env:
          TEAMCITY_URL: ${{ vars.TEAMCITY_URL }}
          TEAMCITY_TOKEN: ${{ secrets.TEAMCITY_TOKEN }}
          TEAMCITY_BUILD_TYPE: ${{ env.TEAMCITY_BUILD_TYPE }}
          TEAMCITY_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          source "$GITHUB_WORKSPACE/.teamcity-ci/.github/scripts/teamcity-cancel.sh"

          teamcity_cancel_branch_builds "$TEAMCITY_BUILD_TYPE" "$TEAMCITY_BRANCH" "Pull request #$PR_NUMBER was closed"

  resolve-build-errors:
    name: Collapse the old build errors
    if: github.event_name == 'pull_request' && needs.trigger-teamcity.result == 'success'
    needs: trigger-teamcity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the TeamCity CI scripts
        uses: actions/checkout@v6
        with:
          repository: ImagingTools/Acf
          ref: ${{ inputs.acf-ref }}
          path: .teamcity-ci
          sparse-checkout: .github/scripts

      - name: Mark the analysis comments as outdated
        uses: actions/github-script@v8
        with:
          script: |
            const comments = require(`${process.env.GITHUB_WORKSPACE}/.teamcity-ci/.github/scripts/teamcity-comments.js`);

            if (!(await comments.isCurrentHead(github, context))) {
              console.log('A newer commit exists, the comment is left to its run.');
              return;
            }

            for (const comment of await comments.findComments(github, context)) {
              await comments.setMinimized(github, core, comment, true);
            }

  analyze-build-errors:
    name: Analyze Build Errors
    runs-on: ubuntu-latest
    needs: trigger-teamcity
    if: always() && github.event_name == 'pull_request' && needs.trigger-teamcity.result == 'failure'
    steps:
      - name: Checkout the TeamCity CI scripts
        uses: actions/checkout@v6
        with:
          repository: ImagingTools/Acf
          ref: ${{ inputs.acf-ref }}
          path: .teamcity-ci
          sparse-checkout: .github/scripts

      - name: Download Build Info Artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: teamcity-build-info-*
          merge-multiple: true
          path: ./teamcity-artifacts

      - name: Describe the failed builds
        id: report
        env:
          TEAMCITY_URL: ${{ vars.TEAMCITY_URL }}
          TEAMCITY_TOKEN: ${{ secrets.TEAMCITY_TOKEN }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          source "$GITHUB_WORKSPACE/.teamcity-ci/.github/scripts/teamcity-summary.sh"

          teamcity_analysis_report ./teamcity-artifacts "$COMMIT_SHA" "$RUN_URL" > teamcity-analysis.md

          # A report is empty when no build failed, for example after a queue timeout.
          if [ -s teamcity-analysis.md ]; then
            echo "has_report=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Post the analysis to the pull request
        if: steps.report.outputs.has_report == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const comments = require(`${process.env.GITHUB_WORKSPACE}/.teamcity-ci/.github/scripts/teamcity-comments.js`);

            if (!(await comments.isCurrentHead(github, context))) {
              console.log('A newer commit exists, the comment is left to its run.');
              return;
            }

            // Every failed run adds a new comment at the end of the conversation and collapses the older ones.
            const maxLength = 60000;

            let body = comments.marker + '\n' + fs.readFileSync('teamcity-analysis.md', 'utf8');
            if (body.length > maxLength) {
              body = body.slice(0, maxLength) + '\n\nThe report was cut, see the TeamCity builds for the rest.';
            }

            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const issueNumber = context.payload.pull_request.number;

            // The older comments are found before the new one is posted, so that it stays open.
            const older = await comments.findComments(github, context);

            await github.rest.issues.createComment({ ...repo, issue_number: issueNumber, body: body });
            console.log(`Posted the analysis comment to PR #${issueNumber}`);

            for (const old of older) {
              await comments.setMinimized(github, core, old, true);
            }
